<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Kinerja Apotek Salam</title>
<style>
:root{--teal:#0FADA6;--teal-d:#0B8F89;--teal-l:#E3F6F5;--orange:#F5A01A;--orange-l:#FEF1DA;--bg:#F3F6F6;--card:#fff;--ink:#1E2928;--mut:#687776;--line:#E2E9E8;--red:#D14343;--red-l:#FCE9E9;--green:#1C9A5E;--green-l:#E2F5EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.scr{min-height:100%;display:flex;flex-direction:column}
.wrap{padding:16px;max-width:560px;width:100%;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:600;font-size:15px}
.btn.primary{background:var(--teal);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:transparent;color:var(--teal-d);border:1.5px solid var(--line)}
.btn.light{background:var(--teal-l);color:var(--teal-d)}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.small{font-size:13px;color:var(--mut)}
.muted{color:var(--mut)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--teal)}
h1,h2,h3{margin:0}
.logoBig{width:220px;max-width:70%;display:block;margin:28px auto 8px}
.center{text-align:center}
.err{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}

/* header */
.top{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{height:34px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--teal-l);color:var(--teal-d)}
.chip.warn{background:var(--orange-l);color:#A86600}
.chip.bad{background:var(--red-l);color:var(--red)}
.chip.ok{background:var(--green-l);color:var(--green)}

/* beranda */
.hello{font-size:18px;font-weight:700}
.clock{font-size:46px;font-weight:700;letter-spacing:1px;line-height:1.1;margin-top:4px}
.clock small{font-size:22px;color:var(--mut);font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.row>.f{flex:1}
.stat{display:flex;gap:12px;align-items:flex-start}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:20px;height:20px}
.ico.t{background:var(--teal-l);color:var(--teal-d)} .ico.o{background:var(--orange-l);color:#B56E00} .ico.r{background:var(--red-l);color:var(--red)} .ico.g{background:var(--green-l);color:var(--green)}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today .box{border:1.5px solid var(--line);border-radius:14px;padding:12px}
.today .box b{display:block;font-size:22px;margin:2px 0}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bigbtns .btn{flex-direction:column;padding:18px 10px;border-radius:16px;font-size:16px}
.bigbtns svg{width:28px;height:28px}
.banner{display:flex;align-items:center;gap:10px;background:var(--orange-l);color:#7A4A00;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}

/* tab bar */
.content{flex:1;padding-bottom:84px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;background:none;padding:9px 0 10px;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--teal-d)}

/* list */
.dateHead{font-size:13px;font-weight:700;color:var(--mut);margin:16px 4px 8px;text-transform:capitalize}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .f{flex:1;min-width:0}
.item .t{font-weight:700}
.link{color:var(--teal-d);font-weight:600;font-size:13px;background:none;padding:4px 0}

/* kamera */
.cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam canvas{object-fit:contain;background:#000}
.cam video.mirror{transform:scaleX(-1)}
.camTop{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.camTop .tt{flex:1;color:#fff;font-weight:700;font-size:17px}
.rb{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center}
.rb svg{width:22px;height:22px}
.camInfo{position:absolute;left:0;right:0;bottom:118px;z-index:2;padding:14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-shadow:0 1px 2px rgba(0,0,0,.6)}
.camInfo .ct{font-size:40px;font-weight:700;line-height:1}
.camInfo .cs{font-size:13px;opacity:.95;margin-top:6px;line-height:1.45}
.camMsg{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:10px;font-size:13px;font-weight:600;text-shadow:none}
.camMsg.ok{background:rgba(28,154,94,.9)} .camMsg.wait{background:rgba(245,160,26,.95);color:#2a1a00} .camMsg.bad{background:rgba(209,67,67,.95)}
.camBottom{position:absolute;left:0;right:0;bottom:0;height:118px;z-index:2;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.35);background-clip:padding-box}
.shutter:disabled{opacity:.35}
.camReview{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
.camReview textarea{width:100%;height:56px;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;outline:none}
.camReview .row .btn{flex:1}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,20,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{font-size:18px;margin-bottom:8px}
.sheet p{margin:6px 0 14px;line-height:1.5;color:#3d4a49}
.okc{width:72px;height:72px;border-radius:50%;background:var(--green-l);color:var(--green);display:flex;align-items:center;justify-content:center;margin:6px auto 10px}
.okc svg{width:38px;height:38px}
.toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:50;background:#1E2928;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;text-align:center;transition:opacity .25s;max-width:528px;margin:0 auto}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
.spin.d{border-color:var(--teal-l);border-top-color:var(--teal)}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-weight:600;text-align:right;word-break:break-all}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:#fff;border-radius:14px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px}
.top .who{font-size:13px;font-weight:600;color:var(--mut);text-align:right;line-height:1.2}
.content{padding-bottom:90px}
.sum span{display:block}
/* v2: level keterampilan (satu warna, terang -> gelap) */
.lv0{background:#EEF6F5;color:#1E2928}.lv1{background:#A9DEDA;color:#1E2928}.lv2{background:#3FB8B1;color:#fff}.lv3{background:#0B6F6A;color:#fff}
.lvx{background:#fff;color:var(--mut);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.lv0,.chip.lv1,.chip.lv2,.chip.lv3{font-weight:600}
.peta{overflow-x:auto;margin:10px -6px 0;-webkit-overflow-scrolling:touch}
.peta table{border-collapse:separate;border-spacing:2px;font-size:12px}
.peta th{font-weight:600;color:var(--mut);vertical-align:bottom;padding:0 0 4px}
.peta th.nm div{writing-mode:vertical-rl;transform:rotate(180deg);max-height:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.peta td.t{min-width:128px;max-width:150px;padding:2px 6px 2px 2px;line-height:1.25;position:sticky;left:0;background:#fff;z-index:1}
.peta td.kel{font-weight:700;color:var(--mut);padding:8px 2px 2px;position:sticky;left:0;background:#fff}
.peta td.c{width:28px;min-width:28px;height:28px;text-align:center;border-radius:7px;font-weight:700;cursor:pointer}
.peta td.c.d{box-shadow:inset 0 0 0 2px #fff;outline:1.5px dashed #687776;outline-offset:-3px}
.peta td.na{background:transparent;cursor:default}
.leg{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:4px;font-style:normal}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.disc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.disc div{border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.disc div.on{border-color:var(--teal);background:var(--teal-l)}
.disc b{display:block;font-size:20px}
.disc span{display:block}
.mt{white-space:pre-wrap;line-height:1.6;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.dpick{display:flex;gap:6px;margin-top:8px}
.dpick button{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink)}
.dpick button.m{background:var(--green-l);border-color:var(--green);color:var(--green)}
.dpick button.l{background:var(--red-l);border-color:var(--red);color:var(--red)}
.cekl{max-height:220px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:4px 10px}
.cekl label{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--ink);margin:8px 0;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--mut);font-weight:600}
.tblw{overflow-x:auto}
/* kinerja & ujian */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.seg button{padding:8px 0;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:16px;color:var(--ink)}
.seg button small{display:block;font-size:10px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.seg button.on small{color:#E3F6F5}
.asp{padding:12px 0;border-bottom:1px solid var(--line)}
.asp:last-child{border-bottom:0}
.big{font-size:30px;font-weight:700;line-height:1.1}
.ujian{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
.ujTop{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.ujTimer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ujTimer.low{color:var(--red)}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;font-size:15px;line-height:1.4;color:var(--ink)}
.opt b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);display:flex;align-items:center;justify-content:center;font-size:13px}
.opt.on{border-color:var(--teal);background:var(--teal-l)}
.opt.on b{background:var(--teal);color:#fff}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.nums button{padding:9px 0;border-radius:9px;background:#fff;border:1.5px solid var(--line);font-weight:600;color:var(--ink)}
.nums button.on{background:var(--teal-l);border-color:var(--teal)}
.nums button.cur{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
/* v2.1: dashboard & grafik */
.hero{background:linear-gradient(135deg,#0FADA6 0%,#0B7F7A 100%);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(11,127,122,.25);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .hello{font-size:20px}
.hs{font-size:13px;color:rgba(255,255,255,.85)}
.hp{font-size:20px;font-weight:700;margin:2px 0 4px}
.chip.hc{background:rgba(255,255,255,.2);color:#fff}
.heroN{display:flex;align-items:center;gap:12px;margin-top:10px;position:relative;z-index:1}
.meter{width:150px;flex:none}
.upd{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px}
.upd.err{background:rgba(209,67,67,.85)}
.spin.s{width:12px;height:12px;border-width:2px}
.dl{display:inline-block;font-size:12px;font-weight:700;margin-top:2px}
.dl.naik{color:var(--green)}.dl.turun{color:var(--red)}.dl.nol{color:var(--mut)}
.dl.inv{background:rgba(255,255,255,.92);padding:2px 8px;border-radius:99px}
.ct{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.nb{background:var(--orange);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.todo{border-left:4px solid var(--orange)}
.todo.ok{border-left-color:var(--green);display:flex;gap:12px;align-items:center}
.ti{display:flex;gap:12px;align-items:center;width:100%;background:#F7FAFA;border-radius:12px;padding:10px;margin-top:8px;text-align:left;color:var(--ink);font-size:14px}
.ti.pt{background:var(--orange-l);font-weight:700}
.ti .ico{width:34px;height:34px}
.ti .ar{color:var(--mut);font-size:20px}
.sum.kpi div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:12px 6px}
.sum.kpi b{font-size:26px;line-height:1.1}
.ring{width:52px;height:52px}
.kpi4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi4>div{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi4>div.r{flex-direction:row;align-items:center;gap:10px}
.kpi4 b{font-size:28px;line-height:1.15}
.dn{display:flex;align-items:center;gap:14px;margin-top:10px}
.donut{width:120px;flex:none}
.lgd{flex:1;min-width:0;font-size:13px}
.lgd div{display:flex;align-items:center;gap:8px;padding:3px 0}
.lgd i{width:12px;height:12px;border-radius:4px;flex:none}
.lgd .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3d4a49}
.lgl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:4px}
.lgl i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart{margin-top:8px}
.kosong{background:#F7FAFA;border:1.5px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;color:var(--mut);font-size:13px;margin-top:10px}
.sub{font-size:13px;font-weight:700;color:var(--mut);margin-top:14px}
.hb{margin-top:6px}
.hbr{display:grid;grid-template-columns:minmax(0,1.1fr) 1fr 44px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.hbr[data-org]{cursor:pointer}
.hbr:last-child{border-bottom:0}
.hbl .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbl .small{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{height:12px;background:#EEF3F3;border-radius:99px;overflow:hidden}
.hbt i{display:block;height:100%;border-radius:99px}
.hbv{text-align:right;font-weight:700;font-size:15px}
.db{margin-top:10px}
.dbr{display:grid;grid-template-columns:26px 78px 1fr 34px;gap:8px;align-items:center;padding:5px 0;opacity:.75}
.dbr.on{opacity:1}
.dbr.on .dbn{font-weight:700;color:var(--ink)}
.dbk{width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.dbn{font-size:13px;color:var(--mut)}
.dbt{position:relative;height:14px;background:#EEF3F3;border-radius:99px}
.dbt i{position:absolute;top:0;bottom:0;border-radius:99px}
.dbt b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#B8C4C3}
.dbv{text-align:right;font-weight:700;font-size:14px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:10px;text-align:center}
.rings .ring{width:64px;height:64px}
.rn{font-size:13px;font-weight:600;margin-top:2px;line-height:1.25}
.sk{background:linear-gradient(90deg,#E8EEEE 25%,#F4F7F7 50%,#E8EEEE 75%);background-size:200% 100%;animation:skl 1.2s infinite;border-radius:16px;margin-bottom:12px}
.sk.hero{height:170px;box-shadow:none}
.sk.hero:after{display:none}
@keyframes skl{to{background-position:-200% 0}}
/* v2.3: panduan */
.pandu{margin-top:12px}
.pandu details{border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.pandu details[open]{border-color:var(--teal)}
.pandu summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.pandu summary::-webkit-details-marker{display:none}
.pandu summary:after{content:"+";color:var(--teal-d);font-size:20px;line-height:1}
.pandu details[open] summary{background:var(--teal-l);color:var(--teal-d)}
.pandu details[open] summary:after{content:"−"}
.pi{padding:4px 14px 12px;font-size:14px;line-height:1.55}
.pi p{margin:8px 0}.pi ul,.pi ol{margin:6px 0;padding-left:20px}.pi li{margin:4px 0}
.pi ul.cek{list-style:none;padding-left:2px}.pi ul.cek li:before{content:"☐ ";color:var(--teal-d)}
.pi .kotak{background:var(--teal-l);border-left:4px solid var(--teal);border-radius:8px;padding:6px 10px;margin:8px 0}
.pi .kotak.penting{background:var(--orange-l);border-left-color:var(--orange)}
.pi table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.pi th,.pi td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.pi th{background:var(--teal-l);color:var(--teal-d)}
/* v2.1: layar lebar (laptop). Tampilan HP tidak berubah. */
@media (min-width:900px){
  .top{padding-left:108px}
  .tabs{top:0;bottom:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;padding:70px 0 0;border-top:0;border-right:1px solid var(--line)}

<body>

<!-- Masuk -->
<section id="scrLogin" class="scr hidden">
  <div class="wrap">
    <img src="img/logo.png" class="logoBig" alt="Apotek Salam">
    <div class="card">
      <h2 style="font-size:19px">Kinerja Karyawan</h2>
      <p class="small" style="margin:6px 0 0">Masuk dengan <b>nama & PIN yang sama</b> seperti aplikasi Absensi.</p>
      <label for="lNama">Nama</label>
      <select id="lNama" class="inp"></select>
      <label for="lPin">PIN</label>
      <input id="lPin" class="inp" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN absensi">
      <div id="loginErr" class="err hidden"></div>
      <button id="btnLogin" class="btn primary block" style="margin-top:14px">Masuk</button>
      <div class="row" style="margin-top:10px;justify-content:space-between"><button id="btnReload" class="link">Muat ulang daftar nama</button><a class="link" href="panduan/Panduan-Karyawan.pdf" target="_blank" rel="noopener" style="text-decoration:none">Panduan (PDF)</a></div>
    </div>
  </div>
</section>

<!-- Aplikasi -->
<section id="scrMain" class="scr hidden">
  <div class="top">
    <img src="img/logo.png" alt="Apotek Salam">
    <div class="sp"></div>
    <div class="who"><span id="topNama"></span><br><button class="link" id="btnKeluar" style="padding:0;font-size:12px">Keluar</button></div>
  </div>
  <div class="content">
    <div id="tab_beranda" class="wrap"></div>
    <div id="tab_ujian" class="wrap hidden"></div>
    <div id="tab_trampil" class="wrap hidden"></div>
    <div id="tab_belajar" class="wrap hidden"></div>
    <div id="tabKinerja" class="wrap hidden"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</section>

<div id="ov" class="ov hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
/* ================= Dasar ================= */
// Alamat server (URL web app Apps Script) disisipkan saat build dari server/server-url.txt.
const SERVER = 'https://script.google.com/macros/s/AKfycbzICYK3JV92Wb3lXLOdAaijvZliUE3eVKX8dBSBuXmawHVW_CICfnlBUEQETv3S22Y6/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ks_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ks_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ks_' + k); } catch (e) {} }
};
let user = LS.get('user', null); // {nama, pin, peran}

async function api(action, data) {
  if (!SERVER) throw new Error('Alamat server belum diatur.');
  const body = Object.assign({ action }, data || {});
  if (user) { body.nama = user.nama; body.pin = user.pin; }
  let res;
  try { res = await fetch(SERVER, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }); }
  catch (e) { const er = new Error('Tidak ada koneksi internet.'); er.net = true; throw er; }
  let j;
  try { j = JSON.parse(await res.text()); } catch (e) { throw new Error('Server bermasalah (kode ' + res.status + '). Coba lagi sebentar lagi.'); }
  if (!j.ok) { const er = new Error(j.error || 'Gagal.'); er.server = true; throw er; }
  return j;
}

const hariIni = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta' }).format(new Date());
function tglPanjang(ymd) {
  const p = String(ymd || '').split('-').map(Number);
  if (p.length !== 3) return ymd || '';
  return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}

let toastT = null;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.classList.add('hidden'), 260); }, ms || 3200);
}
let modalClose = null, modalKunci = false;
function modal(html, onClose) { $('#sheet').innerHTML = html; $('#ov').classList.remove('hidden'); $('#sheet').scrollTop = 0; modalClose = onClose || null; }
function closeModal() { modalKunci = false; $('#ov').classList.add('hidden'); const f = modalClose; modalClose = null; if (f) f(); }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' && !modalKunci) closeModal(); });
function alertBox(title, msg) {
  return new Promise(res => {
    modal('<h3>' + esc(title) + '</h3><div style="margin:6px 0 14px;line-height:1.5;color:#3d4a49">' + msg + '</div><button class="btn primary block" id="mOk">OK</button>', res);
    $('#mOk').onclick = closeModal;
  });
}
function confirmBox(title, msg, okLabel) {
  return new Promise(res => {
    let v = false;
    modal('<h3>' + esc(title) + '</h3><p>' + msg + '</p><div class="row"><button class="btn ghost f" id="mNo">Batal</button><button class="btn primary f" id="mYes">' + esc(okLabel || 'Ya') + '</button></div>', () => res(v));
    $('#mNo').onclick = closeModal;
    $('#mYes').onclick = () => { v = true; closeModal(); };
  });
}
function busy(msg) { modal('<div class="loading"><div class="spin d"></div>' + esc(msg) + '</div>'); }
function show(id) { ['#scrLogin', '#scrMain'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function showErr(el, msg) { el.textContent = msg; el.classList.remove('hidden'); }

/* ================= Masuk / keluar ================= */
async function muatNama() {
  const sel = $('#lNama'); sel.innerHTML = '<option value="">Memuat...</option>';
  $('#loginErr').classList.add('hidden');
  try {
    const j = await api('info');
    sel.innerHTML = '<option value="">— Pilih nama —</option>' + j.karyawan.map(n => '<option>' + esc(n) + '</option>').join('');
    const last = LS.get('lastNama', '');
    if (last && j.karyawan.includes(last)) sel.value = last;
  } catch (e) { sel.innerHTML = '<option value="">Gagal memuat nama</option>'; showErr($('#loginErr'), e.message); }
}
function keLogin(pesan) {
  if (user) LS.del(kunciB()); // data Beranda yang tersimpan di HP ikut dihapus saat keluar
  user = null; LS.del('user'); show('#scrLogin'); $('#lPin').value = ''; muatNama();
  if (pesan) setTimeout(() => showErr($('#loginErr'), pesan), 50);
}
$('#btnReload').onclick = muatNama;
$('#lPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });
$('#btnLogin').onclick = async () => {
  const err = $('#loginErr'); err.classList.add('hidden');
  const nama = $('#lNama').value, pin = $('#lPin').value.trim();
  if (!nama) return showErr(err, 'Pilih nama Anda.');
  if (!pin) return showErr(err, 'Masukkan PIN.');
  const b = $('#btnLogin'); b.disabled = true; b.textContent = 'Memeriksa...';
  try {
    const j = await api('login', { nama, pin });
    user = { nama: j.user.nama, pin, peran: j.user.peran };
    LS.set('user', user); LS.set('lastNama', j.user.nama);
    masuk();
  } catch (e) { showErr(err, e.message); }
  b.disabled = false; b.textContent = 'Masuk';
};
$('#btnKeluar').onclick = async () => { if (await confirmBox('Keluar?', 'Anda perlu memasukkan PIN lagi untuk masuk.', 'Keluar')) keLogin(); };
function masuk() { show('#scrMain'); $('#topNama').textContent = user.nama; K = null; gambarTabs(); pilihTab(TAB); }
// PIN diganti/akun dinonaktifkan di Absensi -> minta login ulang.
const sesiHabis = e => e && e.server && /PIN salah|tidak terdaftar|nonaktif|Terlalu banyak/.test(e.message);

/* ---------- Jabatan karyawan (admin) ---------- */
async function formJabatan() {
  busy('Memuat daftar karyawan...');
  let j;
  try { j = await api('jabatanList'); } catch (e) { closeModal(); return alertBox('Gagal', esc(e.message)); }
  modal('<h3>Jabatan karyawan</h3><p class="small" style="margin-top:0">Nama diambil otomatis dari aplikasi Absensi. Isi jabatan bagi yang ikut penilaian; pilih <b>Tidak dinilai</b> untuk pemilik/admin. Mulai kerja dipakai untuk bonus loyalitas.</p>' +
    j.data.map((k, i) => '<div class="asp"><b>' + esc(k.nama) + '</b>' + (k.peran === 'admin' ? ' <span class="chip">Admin</span>' : '') +
      '<div class="row" style="margin-top:6px"><select class="inp f" data-j="' + i + '"><option value="">— Tidak dinilai —</option>' +
      j.jabatanList.map(x => '<option value="' + x.k + '"' + (k.jabatan === x.k ? ' selected' : '') + '>' + esc(x.nama) + '</option>').join('') + '</select>' +
      '<input type="date" class="inp f" data-m="' + i + '" value="' + esc(k.mulai) + '" max="' + hariIni() + '" aria-label="Mulai kerja"></div></div>').join('') +
    '<div class="small">Kolom kanan = tanggal mulai kerja.</div><div id="jErr" class="err hidden"></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn ghost f" id="jBatal">Batal</button><button class="btn primary f" id="jSimpan">Simpan</button></div>');
  $('#jBatal').onclick = closeModal;
  $('#jSimpan').onclick = async () => {
    const data = j.data.map((k, i) => ({ nama: k.nama, jabatan: $('[data-j="' + i + '"]').value, mulai: $('[data-m="' + i + '"]').value }));
    const b = $('#jSimpan'); b.disabled = true; b.textContent = 'Menyimpan...';
    try { await api('jabatanSimpan', { data }); closeModal(); toast('Jabatan disimpan.'); renderKinerja(); }
    catch (e) { showErr($('#jErr'), e.message); b.disabled = false; b.textContent = 'Simpan'; }
  };
}

/* ================= Kinerja: penilaian & ujian ================= */
const JABN = { AA: 'Asisten Apoteker', TTK: 'TTK', APT: 'Apoteker' };
const SKALA = ['Perlu bimbingan', 'Cukup', 'Baik', 'Sangat baik'];
let K = null, kPeriode = null;
const rupiah = n => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const chipPred = p => p ? '<span class="chip ' + (/gugur|Pembinaan/.test(p) ? 'bad' : /Cukup/.test(p) ? 'warn' : 'ok') + '">' + esc(p) + '</span>' : '';
const fmtN = v => v === null || v === undefined ? '–' : String(Math.round(v * 10) / 10).replace('.', ',');

async function renderKinerja() {
  const el = $('#tabKinerja');
  el.innerHTML = '<div class="loading"><div class="spin d"></div>Memuat...</div>';
  try { K = await api('kinerjaInfo'); }
  catch (e) {
    if (sesiHabis(e)) return keLogin(e.message + ' Silakan masuk lagi.');
    el.innerHTML = '<div class="card center muted">' + esc(e.net ? 'Tidak ada koneksi internet.' : e.message) + '</div><button class="btn light block" id="kUlang">Coba lagi</button>';
    $('#kUlang').onclick = renderKinerja; return;
  }
  if (!kPeriode || !K.periodeList.some(p => p.k === kPeriode)) kPeriode = K.periode;
  let h = '<div class="card"><div class="row"><div class="f"><b style="font-size:17px">Kinerja</b><div class="small">' + esc(K.periodeLabel) + '</div></div>' +
    (K.jabatan ? '<span class="chip">' + esc(K.jabatanNama) + '</span>' : K.admin ? '<span class="chip">Admin · penilai</span>' : '<span class="chip warn">Jabatan belum diatur</span>') + '</div>' +
    (K.jabatan || K.admin ? '' : '<div class="small" style="margin-top:8px">Jabatan Anda belum diisi, jadi belum ikut ujian & penilaian. Hubungi admin.</div>') + '</div>';
  h += '<div class="card"><div class="row"><span class="ico t">' + SVG(IKON.belajar) + '</span><div class="f"><b>Panduan aplikasi</b><div class="small">Cara memakai aplikasi ini, langkah demi langkah.</div></div></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn light f" data-pandu="karyawan">Panduan Karyawan</button>' +
    (K.penilai ? '<button class="btn light f" data-pandu="admin">Panduan Admin</button>' : '') + '</div></div>';
  if (K.jabatan) h += kartuHasilSaya();
  if (K.penilai) {
    h += '<div class="card"><b>Catatan kejadian</b><div class="small" style="margin:4px 0 10px">Catat kejadian penting segera (salah ambil obat, selisih kas/stok, komplain, pujian, dsb.) supaya penilaian triwulan berdasarkan data, bukan ingatan.</div>' +
      '<div class="row"><button class="btn primary f" id="kCatat">+ Catat kejadian</button><button class="btn ghost f" id="kLihat">Lihat catatan</button></div></div>' +
      '<div class="card"><div class="row"><div class="f"><b>Penilaian triwulan</b></div>' +
      selPeriode('kPer') + '</div>' +
      '<div id="kList"><div class="loading"><div class="spin d"></div>Memuat...</div></div></div>';
  }
  const orangRiw = (K.jabatan ? [user.nama] : []).concat(K.penilai ? K.dinilai.map(k => k.nama) : []);
  if (orangRiw.length) h += '<div class="card"><b>Riwayat perkembangan</b><div class="small" style="margin:4px 0 10px">Grafik nilai kinerja dan keterampilan dari triwulan ke triwulan.</div>' +
    (orangRiw.length > 1 ? '<select id="kRiwN" class="inp" style="margin-bottom:8px">' + orangRiw.map(n => '<option>' + esc(n) + '</option>').join('') + '</select>' : '') +
    '<button class="btn light block" id="kRiw">Lihat riwayat</button></div>';
  if (K.admin) h += '<div class="card"><b>Jabatan karyawan</b><div class="small" style="margin:4px 0 10px">Nama otomatis dari aplikasi Absensi. Atur siapa saja yang dinilai (Asisten Apoteker / TTK / Apoteker) dan tanggal mulai kerjanya.</div><button class="btn light block" id="kJab">Atur jabatan & mulai kerja</button></div>';
  h += '<div class="card small" style="line-height:1.55"><b style="color:var(--ink)">Cara penilaian</b><br>Dinilai per triwulan (3 bulan). Nilai 0–100 dari: ketelitian, keramahan, stok & kas, kejujuran, kerja tim, ujian tertulis, dan kedisiplinan (otomatis dari absensi). ' +
    'Bonus: ' + K.tingkat.filter(t => t[2]).map(t => '≥' + t[0] + ' ' + t[1] + ' ' + t[2] + '%').join(' · ') + '. Ada tambahan bonus peningkatan (nilai naik ≥10 poin) dan bonus loyalitas (masa kerja). Pelanggaran kejujuran yang terbukti membuat bonus triwulan itu gugur.</div>';
  el.innerHTML = h;
  el.querySelectorAll('[data-pandu]').forEach(b => b.onclick = () => bukaPanduan(b.dataset.pandu));
  if ($('#kJab')) $('#kJab').onclick = formJabatan;
  if ($('#kRiw')) $('#kRiw').onclick = () => bukaRiwayat($('#kRiwN') ? $('#kRiwN').value : user.nama);
  el.querySelectorAll('[data-hasil]').forEach(b => b.onclick = () => detailHasilSaya(K.hasil[+b.dataset.hasil]));
  if (K.penilai) {
    $('#kCatat').onclick = () => formCatatan();
    $('#kLihat').onclick = lihatCatatan;
    $('#kPer').onchange = e => { kPeriode = e.target.value; muatDaftarNilai(); };
    muatDaftarNilai();
  }
}
/* ---------- Panduan (isi dari panduan/*.md, disisipkan saat build) ---------- */
const PANDUAN = {"karyawan":{"judul":"Panduan Karyawan","pdf":"panduan/Panduan-Karyawan.pdf","bagian":[{"judul":"1. Apa itu aplikasi Kinerja?","html":"<p>Aplikasi ini membantu Anda melihat <b>perkembangan kerja<\/b> sendiri: nilai kinerja, kedisiplinan, keterampilan, hasil ujian, dan bahan belajar.<\/p><ul><li>Penilaian dilakukan <b>per triwulan<\/b> (3 bulan): Jan–Mar, Apr–Jun, Jul–Sep, Okt–Des.<\/li><li><b>Nilai kinerja<\/b> menentukan <b>bonus<\/b>. Isinya: penilaian atasan, Ujian Pengetahuan, dan kedisiplinan dari absensi.<\/li><li><b>Tes lain<\/b> (Tes Penjualan, Tes Gaya Kerja DISC, Ujian Pelayanan) dan <b>nilai keterampilan<\/b> <b>tidak<\/b> memengaruhi bonus. Gunanya untuk mengenal kemampuan dan gaya kerja Anda.<\/li><\/ul>"},{"judul":"2. Membuka dan masuk","html":"<ol start=\"1\"><li>Buka <b>hrdasi.github.io/kinerja-apotek-salam<\/b> di Chrome (HP Android) atau Safari (iPhone).<\/li><li>Pilih <b>nama<\/b> Anda.<\/li><li>Ketik <b>PIN yang sama dengan aplikasi Absensi<\/b>.<\/li><li>Tekan <b>Masuk<\/b>.<\/li><\/ol><div class=\"kotak\"><p><b>Pasang di layar HP supaya mudah dibuka.<\/b> Android (Chrome): ketuk menu <b>⋮<\/b> → <b>Tambahkan ke layar utama<\/b> atau <b>Instal aplikasi<\/b>. iPhone (Safari): ketuk <b>Bagikan<\/b> → <b>Tambahkan ke Layar Utama<\/b>.<\/p><\/div><div class=\"kotak\"><p>Panduan ini juga ada di dalam aplikasi: menu <b>Lainnya<\/b> → <b>Panduan aplikasi<\/b>. Di layar masuk ada tautan <b>Panduan (PDF)<\/b>.<\/p><\/div><div class=\"kotak penting\"><p><b>Penting:<\/b> jangan beri tahu PIN Anda ke orang lain. Kalau PIN diganti di aplikasi Absensi, PIN baru otomatis berlaku juga di sini.<\/p><\/div>"},{"judul":"3. Beranda: ringkasan Anda","html":"<ul><li><b>Kartu hijau di atas<\/b>: nilai kinerja terakhir yang sudah final, predikatnya, dan naik/turun dibanding triwulan lalu.<\/li><li><b>Perlu dikerjakan<\/b>: daftar tugas yang menunggu, misalnya tes yang sudah dibuka atau nilai diri yang belum diisi. <b>Ketuk salah satu<\/b> untuk langsung menuju ke sana.<\/li><li><b>3 kotak angka<\/b>: jumlah keterampilan yang sudah mandiri, nilai disiplin bulan ini, dan gaya kerja DISC Anda.<\/li><\/ul><ul><li><b>Tren nilai kinerja<\/b>: garis nilai dari triwulan ke triwulan. Garis oranye putus-putus = batas predikat <b>Baik (70)<\/b>.<\/li><li><b>Kedisiplinan per bulan<\/b>: dihitung otomatis dari absensi. Mulai dari 100, berkurang kalau terlambat, pulang awal, lupa absen pulang, atau absen di luar lokasi.<\/li><li><b>Ketuk titik<\/b> pada grafik untuk melihat angkanya.<\/li><\/ul><div class=\"kotak\"><p>Beranda langsung menampilkan data terakhir yang tersimpan di HP, lalu memperbarui sendiri. Selama ada tulisan <b>\"Memperbarui…\"<\/b>, data sedang diambil dari server.<\/p><\/div>"},{"judul":"4. Ujian Pengetahuan (masuk nilai & bonus)","html":"<ol start=\"1\"><li>Buka menu <b>Ujian<\/b> di bawah.<\/li><li>Pada kartu <b>Ujian Pengetahuan<\/b>, tekan <b>Mulai ujian<\/b>. Tombol ini hanya ada kalau ujian sudah dibuka admin.<\/li><li>Baca aturannya, lalu tekan <b>Mulai<\/b>.<\/li><\/ol><ol start=\"4\"><li>Pilih jawaban A, B, C, atau D. Soal berikutnya muncul otomatis.<\/li><li>Pakai <b>kotak nomor<\/b> di bawah untuk kembali ke soal yang dilewati.<\/li><li>Setelah selesai, tekan <b>Kirim jawaban<\/b> → <b>Kirim<\/b>. Nilai langsung muncul.<\/li><\/ol><div class=\"kotak\"><p><b>Aturan penting:<\/b><\/p><ul><li>Hanya <b>1 kali kesempatan<\/b> per triwulan.<\/li><li><b>Waktu tetap berjalan<\/b> walau aplikasi ditutup. Jawaban tersimpan di HP, jadi bisa dilanjutkan lewat tombol <b>Lanjutkan<\/b>.<\/li><li>Kalau internet putus saat mengirim, tekan <b>Kirim jawaban<\/b> lagi setelah internet tersambung (paling lambat 10 menit setelah waktu habis).<\/li><li>Kerjakan sendiri, tanpa membuka buku atau bertanya.<\/li><\/ul><\/div>"},{"judul":"5. Tes Gaya Kerja (DISC)","html":"<ol start=\"1\"><li>Di menu <b>Ujian<\/b>, pada kartu <b>Tes Gaya Kerja (DISC)<\/b>, tekan <b>Mulai<\/b>.<\/li><li>Setiap nomor berisi <b>4 pernyataan<\/b>. Pilih:<ul><li><b>1 yang Paling sesuai<\/b> dengan diri Anda (hijau), dan<\/li><li><b>1 yang Paling tidak sesuai<\/b> (merah).<\/li><\/ul><\/li><li>Setelah keduanya dipilih, nomor berikutnya muncul otomatis.<\/li><li>Selesai 24 nomor, tekan <b>Kirim jawaban<\/b>.<\/li><\/ol><ul><li>Hasilnya berupa <b>huruf gaya kerja<\/b>: <b>D<\/b> Dominan, <b>I<\/b> Pemengaruh, <b>S<\/b> Stabil, <b>C<\/b> Cermat.<\/li><li>Batang yang paling panjang ke kanan = gaya kerja Anda yang paling kuat.<\/li><li>Tekan <b>Lihat penjelasan<\/b> untuk membaca kekuatan dan hal yang perlu diperhatikan.<\/li><\/ul><div class=\"kotak\"><p><b>Tidak ada jawaban benar atau salah.<\/b> Jawablah sesuai kebiasaan nyata Anda saat bekerja, bukan yang terlihat paling baik. Hasil DISC tidak memengaruhi nilai atau bonus.<\/p><\/div>"},{"judul":"6. Tes lain dan Ujian Pelayanan","html":"<ul><li><b>Tes Penjualan<\/b>: pilihan ganda seperti Ujian Pengetahuan, tetapi <b>tidak masuk bonus<\/b>.<\/li><li><b>Ujian Pelayanan (Praktik)<\/b>: Anda <b>tidak mengerjakan apa pun di aplikasi<\/b>. Pemilik atau apoteker mengamati Anda saat melayani pembeli (atau lewat role-play), lalu mengisi nilainya. Hasil dan catatannya muncul di kartu tersebut.<\/li><\/ul>"},{"judul":"7. Mengisi nilai diri keterampilan","html":"<ol start=\"1\"><li>Buka menu <b>Keterampilan<\/b>.<\/li><li>Untuk setiap tugas, pilih level yang <b>jujur<\/b>:<ul><li><b>0<\/b> Belum bisa<\/li><li><b>1<\/b> Bisa kalau dibantu<\/li><li><b>2<\/b> Mandiri (ciri-cirinya tertulis di bawah nama tugas)<\/li><li><b>3<\/b> Bisa mengajari orang lain<\/li><\/ul><\/li><li>Tekan <b>Simpan nilai diri<\/b> di paling bawah.<\/li><\/ol><div class=\"kotak\"><p>Isi <b>setiap triwulan<\/b>. Penilaian atasan tampil di setiap tugas sebagai pembanding. Tugas di level 0–1 otomatis mendapat saran materi belajar.<\/p><\/div>"},{"judul":"8. Belajar: materi dan target","html":"<ol start=\"1\"><li>Buka menu <b>Belajar<\/b>.<\/li><li><b>Disarankan untuk Anda<\/b>: materi untuk keterampilan yang masih di level 0–1.<\/li><li>Ketuk materi untuk membacanya, lalu tekan <b>✓ Tandai sudah dibaca<\/b>.<\/li><li><b>Target belajar saya<\/b>: tekan <b>+ Tambah target<\/b>, tulis targetnya (misalnya <i>\"Bisa closing kas sendiri tanpa selisih\"<\/i>), lalu simpan.<\/li><\/ol><div class=\"kotak\"><p>Ubah status target menjadi <b>Berjalan<\/b> saat mulai dikerjakan. Status <b>Tercapai<\/b> diisi oleh atasan.<\/p><\/div>"},{"judul":"9. Melihat hasil penilaian dan bonus","html":"<ol start=\"1\"><li>Buka menu <b>Lainnya<\/b>.<\/li><li>Kartu <b>Hasil penilaian saya<\/b> menampilkan nilai, predikat, dan bonus setiap triwulan yang <b>sudah final<\/b>.<\/li><li>Tekan <b>Rincian<\/b> untuk melihat skor tiap aspek, <b>kelebihan<\/b>, dan <b>saran perbaikan<\/b> dari atasan.<\/li><li><b>Riwayat perkembangan<\/b> → <b>Lihat riwayat<\/b>: grafik nilai dari triwulan ke triwulan.<\/li><\/ol><p><b>Predikat dan bonus<\/b><\/p><table><tr><th>Nilai<\/th><th>Predikat<\/th><th>Bonus<\/th><\/tr><tr><td>90 ke atas<\/td><td>Istimewa<\/td><td>100%<\/td><\/tr><tr><td>80–89<\/td><td>Sangat Baik<\/td><td>75%<\/td><\/tr><tr><td>70–79<\/td><td>Baik<\/td><td>50%<\/td><\/tr><tr><td>60–69<\/td><td>Cukup<\/td><td>25%<\/td><\/tr><tr><td>di bawah 60<\/td><td>Perlu Pembinaan<\/td><td>0%<\/td><\/tr><\/table><ul><li><b>Bonus loyalitas<\/b>: bonus dikalikan tambahan 5% per tahun masa kerja (maksimal 25%). Contoh: bonus 50% dengan masa kerja 2 tahun menjadi 50% × 1,10 = 55%.<\/li><li><b>Bonus peningkatan<\/b>: +10% kalau nilai naik 10 poin atau lebih dari triwulan lalu.<\/li><li><b>Pelanggaran kejujuran yang terbukti<\/b> membuat bonus triwulan itu gugur.<\/li><\/ul>"},{"judul":"10. Kalau ada masalah","html":"<table><tr><th>Masalah<\/th><th>Yang dilakukan<\/th><\/tr><tr><td>Nama saya tidak ada di daftar<\/td><td>Hubungi admin. Nama diambil dari aplikasi Absensi.<\/td><\/tr><tr><td>\"PIN salah\"<\/td><td>Pakai PIN Absensi. Lupa PIN? Minta admin menggantinya di Absensi. 5 kali salah = terkunci 15 menit.<\/td><\/tr><tr><td>\"Jabatan belum diatur\"<\/td><td>Hubungi admin untuk mengisi jabatan Anda.<\/td><\/tr><tr><td>Ujian terputus (HP mati / sinyal hilang)<\/td><td>Buka lagi aplikasinya, lalu tekan <b>Lanjutkan<\/b>. Kalau waktu sudah habis, hubungi admin.<\/td><\/tr><tr><td>Muncul \"Versi baru sudah terpasang\"<\/td><td>Tutup aplikasi, lalu buka lagi.<\/td><\/tr><tr><td>Data terasa belum terbaru<\/td><td>Pindah ke menu lain lalu kembali ke Beranda, atau tutup dan buka lagi aplikasinya.<\/td><\/tr><\/table>"}]},"admin":{"judul":"Panduan Admin & Penilai","pdf":"panduan/Panduan-Admin.pdf","bagian":[{"judul":"1. Siapa bisa apa?","html":"<table><tr><th>Peran<\/th><th>Siapa<\/th><th>Yang bisa dilakukan<\/th><\/tr><tr><td><b>Admin<\/b><\/td><td>Pemilik (peran <i>admin<\/i> di aplikasi Absensi)<\/td><td>Semua: menilai semua karyawan, mengatur jabatan, membuka ujian, mengelola soal, tugas, dan materi.<\/td><\/tr><tr><td><b>Penilai<\/b><\/td><td>Apoteker<\/td><td>Menilai <b>Asisten Apoteker &amp; TTK<\/b>: penilaian triwulan, keterampilan, Ujian Pelayanan, catatan kejadian, target belajar. Tidak bisa menilai dirinya sendiri atau apoteker lain.<\/td><\/tr><tr><td><b>Karyawan<\/b><\/td><td>AA, TTK, Apoteker<\/td><td>Mengerjakan ujian &amp; tes, mengisi nilai diri, belajar. Lihat <i>Panduan Karyawan<\/i>.<\/td><\/tr><\/table><p>Masuk dengan <b>nama &amp; PIN yang sama seperti aplikasi Absensi<\/b>. Alamat: <b>hrdasi.github.io/kinerja-apotek-salam<\/b>. Di laptop, menu ada di samping kiri dan Beranda tersusun beberapa kolom. Panduan ini (dan Panduan Karyawan) juga ada di aplikasi: menu <b>Lainnya<\/b> → <b>Panduan aplikasi<\/b>.<\/p>"},{"judul":"2. Persiapan awal (sekali saja)","html":"<ol start=\"1\"><li>Menu <b>Lainnya<\/b> → <b>Atur jabatan &amp; mulai kerja<\/b>.<\/li><li>Isi jabatan setiap karyawan (<b>Asisten Apoteker / TTK / Apoteker<\/b>). Pilih <b>Tidak dinilai<\/b> untuk pemilik.<\/li><li>Isi <b>tanggal mulai kerja<\/b> (dipakai untuk bonus loyalitas), lalu <b>Simpan<\/b>.<\/li><\/ol><ol start=\"4\"><li>Buka <b>Google Sheet Kinerja<\/b> → tab <b>Pengaturan<\/b> → isi <b>Bonus Penuh (Rp)<\/b> untuk setiap jabatan. Tanpa ini, bonus hanya tampil dalam persen.<\/li><li><b>Periksa isi awal bersama apoteker<\/b> sebelum dibuka ke karyawan:<ul><li>Bank soal Ujian Pengetahuan (menu <b>Ujian<\/b> → <b>Kelola bank soal<\/b>)<\/li><li>Soal Tes Penjualan, nomor DISC, dan checklist Ujian Pelayanan (<b>Kelola soal / Kelola checklist<\/b> di kartu masing-masing)<\/li><li>Daftar tugas keterampilan (menu <b>Keterampilan<\/b> → <b>Kelola daftar tugas<\/b>)<\/li><li>Materi belajar (menu <b>Belajar<\/b>)<\/li><\/ul><\/li><\/ol><div class=\"kotak\"><p>Karyawan baru cukup ditambahkan di <b>aplikasi Absensi<\/b>, lalu diatur jabatannya di sini. Karyawan yang dinonaktifkan di Absensi tidak bisa masuk lagi (paling lama 10 menit kemudian).<\/p><\/div>"},{"judul":"3. Membaca dashboard Beranda","html":"<ul><li><b>4 angka utama<\/b>: rata-rata nilai tim (dengan panah naik/turun dibanding triwulan lalu), jumlah penilaian yang sudah final, disiplin tim bulan ini, dan jumlah <b>titik rawan<\/b>.<\/li><li><b>Nilai per orang<\/b>: batang hijau = baik, oranye = cukup, merah = perlu pembinaan. Batang pudar = masih draf.<\/li><li><b>Ketuk nama<\/b> untuk melihat detail orang itu: semua nilai, gaya kerja DISC, dan grafik disiplinnya.<\/li><\/ul><ul><li><b>Tren rata-rata nilai tim<\/b>: garis per triwulan. Akan terisi seiring berjalannya triwulan.<\/li><li><b>Kedisiplinan tim per bulan<\/b>: garis tebal = rata-rata tim, garis tipis = tiap orang. Ketuk titik untuk melihat nilainya.<\/li><li><b>Ujian &amp; tes<\/b>: lingkaran progres berapa orang yang sudah mengerjakan.<\/li><li><b>Komposisi DISC<\/b>, <b>keterampilan mandiri per orang<\/b>, <b>peta keterampilan<\/b>, dan <b>titik rawan<\/b> ada di bawahnya.<\/li><\/ul><div class=\"kotak\"><p><b>Titik rawan<\/b> = tugas yang hanya dikuasai 0–1 orang. Kalau orang itu libur atau keluar, apotek kesulitan. Jadikan prioritas pelatihan silang.<\/p><\/div>"},{"judul":"4. Membuka dan menutup ujian & tes","html":"<ol start=\"1\"><li>Menu <b>Ujian<\/b>. Bagian <b>Hasil tim<\/b> menampilkan setiap ujian/tes.<\/li><li>Centang <b>Dibuka untuk karyawan<\/b>, atur <b>jumlah soal<\/b> dan <b>durasi<\/b>, lalu tekan <b>Simpan pengaturan<\/b>. (Membuka/menutup ujian dan tombol <b>Ulang<\/b> khusus admin; apoteker bisa melihat hasilnya.)<\/li><li>Daftar di bawahnya menunjukkan siapa yang <b>belum<\/b>, <b>sedang mengerjakan<\/b>, atau sudah selesai beserta nilainya.<\/li><li>Setelah semua selesai, hilangkan centang <b>Dibuka<\/b> dan simpan lagi.<\/li><\/ol><ul><li><b>Ulang<\/b>: hapus hasil seseorang agar ia bisa mengerjakan lagi. Pakai <b>hanya<\/b> kalau ada kendala (HP mati, sinyal putus).<\/li><li><b>Lihat<\/b> (Tes DISC): membuka gaya kerja orang tersebut beserta penjelasannya.<\/li><li><b>Pilih triwulan<\/b> di atas untuk melihat hasil triwulan sebelumnya.<\/li><\/ul><div class=\"kotak\"><p>Soal <b>tidak bisa diubah selama ujian dibuka<\/b>. Tutup ujian dulu kalau mau memperbaiki soal.<\/p><\/div><p><b>Ganti soal setiap triwulan (Ujian Pengetahuan):<\/b> saat ujian ditutup, buka <b>Kelola bank soal<\/b> → pilih paket lama → <b>Nonaktifkan paket<\/b> → pilih paket baru → <b>Aktifkan paket<\/b>.<\/p>"},{"judul":"5. Menilai Ujian Pelayanan (praktik)","html":"<ol start=\"1\"><li>Amati karyawan saat <b>melayani pembeli<\/b> (atau lewat role-play).<\/li><li>Menu <b>Ujian<\/b> → kartu <b>Ujian Pelayanan<\/b> → tekan <b>Nilai<\/b> di samping namanya.<\/li><li>Beri skor setiap butir: <b>1<\/b> tidak dilakukan · <b>2<\/b> kurang · <b>3<\/b> baik · <b>4<\/b> sangat baik.<\/li><li>Tulis <b>catatan<\/b> (kelebihan &amp; saran), lalu <b>Simpan<\/b>. Karyawan bisa membaca hasil dan catatannya.<\/li><\/ol>"},{"judul":"6. Menilai keterampilan tim","html":"<ol start=\"1\"><li>Menu <b>Keterampilan<\/b> → kartu <b>Nilai keterampilan tim<\/b> → <b>Nilai<\/b> di samping nama.<\/li><li>Pilih level setiap tugas: <b>0<\/b> belum bisa · <b>1<\/b> bisa dibantu · <b>2<\/b> mandiri · <b>3<\/b> bisa mengajari. Nilai diri karyawan tampil sebagai pembanding.<\/li><li>Tekan <b>Simpan<\/b>.<\/li><\/ol><ul><li><b>Beda pendapat<\/b>: nilai diri dan nilai atasan berbeda 2 level atau lebih. Bicarakan empat mata.<\/li><li><b>Kelola daftar tugas<\/b> (khusus admin): tambah, ubah, atau nonaktifkan tugas per jabatan.<\/li><li>Nilai keterampilan <b>tidak memengaruhi bonus<\/b>.<\/li><\/ul>"},{"judul":"7. Catatan kejadian","html":"<ol start=\"1\"><li>Menu <b>Lainnya<\/b> → <b>+ Catat kejadian<\/b>.<\/li><li>Pilih karyawan, tanggal, dan <b>kategori<\/b> (salah ambil obat, selisih kas, komplain, pujian pelanggan, inisiatif, dll.).<\/li><li>Isi jumlah (kalau ada) dan keterangan singkat, lalu <b>Simpan<\/b>.<\/li><\/ol><div class=\"kotak\"><p><b>Catat segera saat kejadian<\/b>, supaya penilaian di akhir triwulan berdasarkan data, bukan ingatan. Catat juga hal <b>baik<\/b> (pujian, inisiatif, mengakui kesalahan).<\/p><\/div><div class=\"kotak penting\"><p><b>Penting:<\/b> kategori <b>\"Pelanggaran kejujuran (terbukti)\"<\/b> membuat <b>bonus triwulan itu gugur<\/b>. Pakai hanya untuk pelanggaran yang sudah terbukti dan sudah dibicarakan empat mata. Tulis bukti/kronologinya dengan jelas.<\/p><\/div>"},{"judul":"8. Penilaian triwulan & bonus","html":"<ol start=\"1\"><li>Menu <b>Lainnya<\/b> → kartu <b>Penilaian triwulan<\/b> → pilih triwulan → tekan <b>Nilai<\/b> di samping nama.<\/li><li>Periksa <b>data otomatis<\/b>: kedisiplinan, ujian tertulis, masa kerja, dan <b>catatan kejadian<\/b> triwulan itu.<\/li><li>Beri skor <b>1–4<\/b> setiap aspek: 1 perlu bimbingan · 2 cukup · 3 baik · 4 sangat baik.<\/li><li>Tulis <b>Kelebihan<\/b> dan <b>Saran perbaikan<\/b>. Keduanya akan dibaca karyawan.<\/li><li>Kotak hijau di bawah menampilkan <b>perkiraan nilai &amp; bonus<\/b> secara langsung.<\/li><li>Tekan <b>Simpan draf<\/b> (masih bisa diubah) atau <b>Finalkan<\/b>.<\/li><\/ol><div class=\"kotak\"><p>Setelah <b>final<\/b>, hasilnya bisa dilihat karyawan dan <b>hanya admin<\/b> yang bisa mengubahnya.<\/p><\/div><p><b>Bobot penilaian (%)<\/b><\/p><table><tr><th>Aspek<\/th><th>AA<\/th><th>TTK<\/th><th>Apoteker<\/th><\/tr><tr><td>Ketelitian pelayanan<\/td><td>20<\/td><td>25<\/td><td>–<\/td><\/tr><tr><td>Supervisi &amp; pembinaan tim<\/td><td>–<\/td><td>–<\/td><td>20<\/td><\/tr><tr><td>PIO, konseling &amp; keputusan resep<\/td><td>–<\/td><td>–<\/td><td>20<\/td><\/tr><tr><td>Regulasi &amp; dokumentasi<\/td><td>–<\/td><td>–<\/td><td>15<\/td><\/tr><tr><td>Keramahan &amp; KIE<\/td><td>20<\/td><td>15<\/td><td>–<\/td><\/tr><tr><td>Stok &amp; kas<\/td><td>15<\/td><td>15<\/td><td>10<\/td><\/tr><tr><td>Kejujuran &amp; integritas<\/td><td>15<\/td><td>15<\/td><td>15<\/td><\/tr><tr><td>Ujian tertulis (otomatis)<\/td><td>10<\/td><td>15<\/td><td>10<\/td><\/tr><tr><td>Kedisiplinan (otomatis)<\/td><td>15<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>Kerja tim &amp; inisiatif<\/td><td>5<\/td><td>5<\/td><td>5<\/td><\/tr><\/table><p><b>Bonus:<\/b> ≥90 Istimewa 100% · ≥80 Sangat Baik 75% · ≥70 Baik 50% · ≥60 Cukup 25% · &lt;60 Perlu Pembinaan 0%. <b>Loyalitas<\/b>: bonus dikalikan tambahan 5% per tahun masa kerja (maksimal 25%). Contoh: bonus 50% dengan masa kerja 2 tahun menjadi 50% × 1,10 = 55%. Ditambah <b>peningkatan<\/b> 10% kalau nilai naik 10 poin atau lebih. Nominal Rp = Bonus Penuh × persen bonus. Semua angka persen bisa diubah di tab <b>Pengaturan<\/b> Sheet.<\/p>"},{"judul":"9. Target belajar & materi","html":"<ol start=\"1\"><li>Menu <b>Belajar<\/b> → kartu <b>Target belajar tim<\/b> → <b>Buka<\/b> di samping nama.<\/li><li><b>Saran dari keterampilan level 0–1<\/b> muncul otomatis. Tekan <b>+ Target<\/b> untuk menjadikannya target.<\/li><li>Pantau catatan perkembangan. Ubah status menjadi <b>Tercapai<\/b> atau <b>Tidak tercapai<\/b> di akhir triwulan.<\/li><\/ol><ul><li><b>+ Tambah materi<\/b> (khusus admin): judul, isi atau link (YouTube, Google Drive, PDF), dan <b>keterampilan terkait<\/b>. Materi otomatis disarankan ke karyawan yang keterampilannya masih di level 0–1.<\/li><li>Di setiap materi terlihat siapa saja yang <b>sudah membaca<\/b>.<\/li><\/ul>"},{"judul":"10. Rutinitas setiap triwulan","html":"<p><b>Awal triwulan (minggu pertama)<\/b><\/p><ul class=\"cek\"><li>Ganti/aktifkan paket soal baru (kalau ada), lalu <b>buka Ujian Pengetahuan<\/b> dan tes lain.<\/li><li>Ingatkan karyawan untuk <b>mengisi nilai diri<\/b> keterampilan.<\/li><li>Buat <b>target belajar<\/b> bersama setiap karyawan.<\/li><\/ul><p><b>Setiap minggu<\/b><\/p><ul class=\"cek\"><li>Catat <b>kejadian<\/b> penting (baik maupun buruk).<\/li><li>Lihat <b>Beranda<\/b>: titik rawan, disiplin, progres ujian.<\/li><li>Amati dan nilai <b>Ujian Pelayanan<\/b> secara bertahap.<\/li><\/ul><p><b>Akhir triwulan (minggu terakhir)<\/b><\/p><ul class=\"cek\"><li>Pastikan semua sudah ujian, lalu <b>tutup<\/b> ujian &amp; tes.<\/li><li><b>Nilai keterampilan<\/b> tim.<\/li><li>Isi <b>penilaian triwulan<\/b> → periksa → <b>Finalkan<\/b>.<\/li><li>Bahas hasilnya <b>empat mata<\/b> dengan setiap karyawan. Tandai target belajar yang <b>tercapai<\/b>.<\/li><\/ul>"},{"judul":"11. Kalau ada masalah","html":"<table><tr><th>Masalah<\/th><th>Yang dilakukan<\/th><\/tr><tr><td>Karyawan lupa PIN<\/td><td>Ganti PIN di <b>aplikasi Absensi<\/b>. PIN baru langsung berlaku di sini.<\/td><\/tr><tr><td>Karyawan baru tidak muncul<\/td><td>Tambahkan di aplikasi Absensi, lalu atur jabatannya (<b>Lainnya<\/b> → <b>Atur jabatan<\/b>).<\/td><\/tr><tr><td>Karyawan \"Jabatan belum diatur\"<\/td><td>Isi jabatannya lewat <b>Atur jabatan &amp; mulai kerja<\/b>.<\/td><\/tr><tr><td>Ujian karyawan terputus dan waktunya habis<\/td><td>Menu <b>Ujian<\/b> → tekan <b>Ulang<\/b> di samping namanya.<\/td><\/tr><tr><td>Bonus tidak tampil dalam Rupiah<\/td><td>Isi <b>Bonus Penuh (Rp)<\/b> di tab Pengaturan Google Sheet.<\/td><\/tr><tr><td>Soal tidak bisa diubah<\/td><td>Ujian sedang dibuka. Tutup dulu, ubah soal, lalu buka lagi.<\/td><\/tr><tr><td>Angka di Beranda belum berubah setelah mengubah Sheet langsung<\/td><td>Tunggu sekitar 10 menit atau ubah lewat aplikasi. Data yang diubah lewat aplikasi langsung diperbarui.<\/td><\/tr><\/table>"}]}};
function bukaPanduan(kode) {
  const P = PANDUAN && PANDUAN[kode];
  if (!P) return alertBox('Panduan', 'Panduan belum tersedia di versi ini.');
  modal('<h3>' + esc(P.judul) + '</h3><div class="small">Ketuk judul bagian untuk membuka isinya.</div>' +
    '<a class="btn primary block" style="margin-top:12px;text-decoration:none" href="' + esc(P.pdf) + '" target="_blank" rel="noopener">' + SVG('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>').replace('<svg', '<svg width="20" height="20"') + 'Unduh PDF bergambar</a>' +
    '<div class="pandu">' + P.bagian.map((b, i) => '<details' + (i ? '' : ' open') + '><summary>' + esc(b.judul) + '</summary><div class="pi">' + b.html + '</div></details>').join('') + '</div>' +
    '<button class="btn ghost block" id="mOk" style="margin-top:12px">Tutup</button>');
  $('#mOk').onclick = closeModal;
}
const selPeriode = id => '<select id="' + id + '" class="inp" style="width:auto;padding:9px 10px">' + K.periodeList.map(p => '<option value="' + p.k + '"' + (p.k === kPeriode ? ' selected' : '') + '>' + esc(p.label.replace(/ \(.*\)/, '')) + '</option>').join('') + '</select>';

function kartuUjian() {
  const U = K.ujian, H = U.hasil;
  let b = '<div class="card"><div class="row"><b class="f">Ujian Pengetahuan</b><span class="chip ok">Masuk nilai kinerja</span></div>';
  if (H && H.status === 'Selesai') {
    b += '<div class="row" style="margin-top:8px"><div class="big">' + fmtN(H.nilai) + '</div><div class="small f">Nilai ujian triwulan ini<br>' + H.benar + ' dari ' + H.jumlah + ' soal benar</div></div>';
  } else if (H && H.status === 'Berlangsung') {
    b += '<div class="small" style="margin:4px 0 10px">Ujian Anda sedang berjalan. Sisa waktu ±' + Math.ceil((H.sisa || 0) / 60) + ' menit.</div><button class="btn orange block" id="uMulai">Lanjutkan ujian</button>';
  } else if (U.dibuka) {
    b += '<div class="small" style="margin:4px 0 10px">' + U.jumlah + ' soal pilihan ganda · ' + U.durasi + ' menit · <b>hanya 1 kali kesempatan</b> per triwulan.</div><button class="btn primary block" id="uMulai">Mulai ujian</button>';
  } else {
    b += '<div class="small" style="margin-top:4px">Ujian triwulan ini belum dibuka.</div>';
  }
  return b + '</div>';
}

function kartuHasilSaya() {
  return '<div class="card"><b>Hasil penilaian saya</b>' + (K.hasil.length ? K.hasil.map((x, i) =>
    '<div class="item"><div class="f"><div class="t">' + esc(x.label) + '</div><div class="small">Nilai ' + fmtN(x.total) + ' · bonus ' + fmtN(x.akhir) + '%' + (x.rp ? ' (' + rupiah(x.rp) + ')' : '') + '</div></div>' +
    chipPred(x.predikat) + '<button class="link" data-hasil="' + i + '">Rincian</button></div>').join('')
    : '<div class="small" style="margin-top:6px">Belum ada hasil penilaian final.</div>') + '</div>';
}

  modal('<h3>' + esc(x.label) + '</h3><div class="row" style="margin:6px 0 10px"><div class="big">' + fmtN(x.total) + '</div>' + chipPred(x.predikat) + '</div>' +
    x.rincian.map(r => '<div class="kv"><span>' + esc(r.nama) + ' <span class="small">(' + r.bobot + '%)</span></span><span>' +
      (r.skor ? r.skor + ' · ' + esc(SKALA[r.skor - 1]) : r.nilai === null || r.nilai === undefined ? 'belum ada' : fmtN(r.nilai)) + '</span></div>').join('') +
    '<div class="kv"><span>Bonus</span><span>' + fmtN(x.akhir) + '%' + (x.rp ? ' · ' + rupiah(x.rp) : '') + '</span></div>' +
    (x.kelebihan ? '<p><b>Kelebihan:</b> ' + esc(x.kelebihan) + '</p>' : '') +
    (x.saran ? '<p><b>Saran perbaikan:</b> ' + esc(x.saran) + '</p>' : '') +
    '<button class="btn primary block" id="mOk">Tutup</button>');
  $('#mOk').onclick = closeModal;
}

/* ---------- Catatan kejadian ---------- */
function formCatatan(nama) {
  const today = hariIni();
  modal('<h3>Catat kejadian</h3>' +
    '<label for="cNama">Karyawan</label><select id="cNama" class="inp">' + K.dinilai.map(k => '<option' + (k.nama === nama ? ' selected' : '') + '>' + esc(k.nama) + '</option>').join('') + '</select>' +
    '<label for="cTgl">Tanggal kejadian</label><input id="cTgl" type="date" class="inp" max="' + today + '" value="' + today + '">' +
    '<label for="cKat">Kategori</label><select id="cKat" class="inp"><option value="">— Pilih —</option>' +
      K.kategori.map(k => '<option>' + esc(k.nama) + '</option>').join('') + '</select>' +
    '<div id="cWarn" class="err hidden">Hanya untuk pelanggaran yang <b>sudah terbukti</b> dan sudah dibicarakan empat mata. Bonus triwulan ini akan gugur. Tulis bukti/kronologi dengan jelas.</div>' +
    '<label for="cJml">Jumlah / nominal (opsional)</label><input id="cJml" class="inp" maxlength="40" placeholder="mis. Rp20.000 atau 2 strip">' +
    '<label for="cKet">Keterangan</label><textarea id="cKet" class="inp" rows="3" maxlength="300" placeholder="Apa yang terjadi?"></textarea>' +
    '<div id="cErr" class="err hidden"></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn ghost f" id="cBatal">Batal</button><button class="btn primary f" id="cSimpan">Simpan</button></div>');
  if (!K.dinilai.length) showErr($('#cErr'), 'Belum ada karyawan yang bisa dinilai. ' + (K.admin ? 'Isi jabatan lewat kartu "Jabatan karyawan".' : 'Hubungi admin.'));
  $('#cKat').onchange = e => $('#cWarn').classList.toggle('hidden', !/kejujuran/.test(e.target.value));
  $('#cBatal').onclick = closeModal;
  $('#cSimpan').onclick = async () => {
    const d = { target: $('#cNama').value, tanggal: $('#cTgl').value, kategori: $('#cKat').value, jumlah: $('#cJml').value.trim(), ket: $('#cKet').value.trim() };
    if (!d.target) return;
    if (!d.kategori) return showErr($('#cErr'), 'Pilih kategori.');
    const b = $('#cSimpan'); b.disabled = true; b.textContent = 'Menyimpan...';
    try { await api('catatanSimpan', d); closeModal(); toast('Catatan untuk ' + d.target + ' disimpan.'); }
    catch (e) { showErr($('#cErr'), e.message); b.disabled = false; b.textContent = 'Simpan'; }
  };
}

async function lihatCatatan() {
  busy('Memuat catatan...');
  let j;
  try { j = await api('catatanList', { periode: kPeriode }); } catch (e) { closeModal(); return alertBox('Gagal', esc(e.message)); }
  const per = K.periodeList.find(p => p.k === kPeriode);
  modal('<h3>Catatan kejadian</h3><div class="small">' + esc(per ? per.label : kPeriode) + '</div>' +
    (j.data.length ? j.data.map(c => itemCatatan(c)).join('') : '<p class="muted">Belum ada catatan di triwulan ini.</p>') +
    '<button class="btn primary block" id="mOk" style="margin-top:12px">Tutup</button>');
  $('#mOk').onclick = closeModal;
  $('#sheet').querySelectorAll('[data-hapus]').forEach(b => b.onclick = async () => {
    if (!(await confirmBox('Hapus catatan?', 'Catatan ini akan dihapus permanen.', 'Hapus'))) return lihatCatatan();
    try { await api('catatanHapus', { id: b.dataset.hapus }); toast('Catatan dihapus.'); } catch (e) { toast(e.message); }
    lihatCatatan();
  });
}
function itemCatatan(c) {

    (kat === 'plus' ? 'ok' : kat === 'gugur' ? 'bad' : kat === 'minus' ? 'warn' : '') + '">' + esc(c.kategori) + '</span></div>' +
    '<div class="small">' + esc(tglPanjang(c.tanggal)) + (c.jumlah ? ' · ' + esc(c.jumlah) : '') + ' · oleh ' + esc(c.oleh) + '</div>' +

    (c.hapus ? '<button class="link" data-hapus="' + esc(c.id) + '">Hapus</button>' : '') + '</div>';
}

  try {
    const j = await api('nilaiDaftar', { periode: kPeriode });

    $('#kList').innerHTML = j.data.length ? j.data.map(x =>

      (x.status ? ' · ' + esc(x.status) + ' · nilai ' + fmtN(x.total) : ' · belum dinilai') + (x.ujian !== null ? ' · ujian ' + fmtN(x.ujian) : '') + '</div></div>' +
      chipPred(x.status === 'Final' ? x.predikat : '') + '<button class="link" data-nilai="' + esc(x.nama) + '">' + (x.status ? 'Buka' : 'Nilai') + '</button></div>').join('')
      : '<div class="small" style="margin-top:8px">Belum ada karyawan yang bisa dinilai. ' + (K.admin ? 'Isi jabatan lewat kartu "Jabatan karyawan" di bawah.' : 'Hubungi admin.') + '</div>';
    $('#kList').querySelectorAll('[data-nilai]').forEach(b => b.onclick = () => formNilai(b.dataset.nilai));
  } catch (e) { if ($('#kList')) $('#kList').innerHTML = '<div class="small" style="color:var(--red)">' + esc(e.message) + '</div>'; }
}

// Pratinjau di HP; server menghitung ulang saat disimpan.
function hitungLokal(jk, skor, D) {
  let sumW = 0, sum = 0; const kurang = [];
  K.aspek.forEach(a => {
    const w = a.bobot[jk]; if (!w) return;
    let v = null;
    if (a.k === 'disiplin') v = D.disiplin ? D.disiplin.nilai : null;
    else if (a.k === 'ujian') v = D.ujian ? D.ujian.nilai : null;
    else if (skor[a.k]) v = skor[a.k] * 25; else kurang.push(a.nama);
    if (v !== null && v !== undefined) { sumW += w; sum += w * v; }
  });
  const o = { total: sumW ? Math.round(sum / sumW * 10) / 10 : null, kurang, predikat: '', akhir: 0, rp: 0, tingkat: 0, loyal: 0, naik: 0 };
  if (o.total === null) return o;
  const P = D.param, t = K.tingkat.find(t => o.total >= t[0]) || K.tingkat[K.tingkat.length - 1];
  o.predikat = t[1] + (P.gugur.length ? ' (bonus gugur)' : '');
  o.tingkat = P.gugur.length ? 0 : t[2];
  o.loyal = o.tingkat ? P.loyal : 0;
  o.naik = !P.gugur.length && P.prevTotal !== null && o.total - P.prevTotal >= 10 ? P.naikPct : 0;
  o.akhir = Math.round((o.tingkat * (1 + o.loyal / 100) + o.naik) * 10) / 10;
  o.rp = P.penuh ? Math.round(P.penuh * o.akhir / 100 / 1000) * 1000 : 0;
  return o;
}

async function formNilai(nama) {
  busy('Memuat data ' + nama + '...');
  let D;
  try { D = await api('nilaiDetail', { target: nama, periode: kPeriode }); } catch (e) { closeModal(); return alertBox('Gagal', esc(e.message)); }
  formNilaiData(D);
}
function formNilaiData(D) {
  const skor = Object.assign({}, D.skor), dis = D.disiplin, P = D.param, kunci = D.kunci;
  const manual = K.aspek.filter(a => !a.auto && a.bobot[D.jabatan]);

/* ---------- Layar ujian (karyawan) ---------- */
let UJ = null;
// J = jenis sub-ujian dari subInfo (Tes Penjualan, DISC, dll.); kosong = Ujian Pengetahuan (masuk nilai).
async function mulaiUjian(J) {
  const sub = !!(J && J.kode), H = sub ? J.hasil : K.ujian.hasil, lanjut = H && H.status === 'Berlangsung';
  const jml = sub ? J.jumlah : K.ujian.jumlah, dur = sub ? J.durasi : K.ujian.durasi, disc = sub && J.tipe === 'disc';
  if (!lanjut && !(await confirmBox('Mulai ' + (sub ? J.nama : 'Ujian Pengetahuan') + '?', disc ?
    jml + ' nomor · ' + dur + ' menit.<br><br>• Setiap nomor berisi 4 pernyataan. Pilih <b>1 yang paling sesuai</b> dan <b>1 yang paling tidak sesuai</b> dengan diri Anda.<br>• Tidak ada jawaban benar atau salah. Jawab jujur, jangan memilih yang "terlihat bagus".<br>• Hanya 1 kali per triwulan.' :
    jml + ' soal · ' + dur + ' menit.<br><br>• Hanya <b>1 kali kesempatan</b>.<br>• Waktu tetap berjalan walau aplikasi ditutup.<br>• Pastikan baterai & internet cukup.<br>• Kerjakan sendiri, tanpa membuka buku atau bertanya.', 'Mulai'))) return;
  busy('Menyiapkan soal...');
  try {
    const j = sub ? await api('subMulai', { jenis: J.kode }) : await api('ujianMulai');
    closeModal();
    if (j.selesai) { await alertBox('Sudah selesai', hasilTeks(J, j.hasil)); K = null; return renderTab(); }
    const kunci = 'uj_' + (sub ? J.kode + '_' : '') + j.periode + '_' + user.nama;
    UJ = { jenis: sub ? J.kode : '', nama: sub ? J.nama : 'Ujian ' + (JABN[K.jabatan] || ''), tipe: sub ? J.tipe : 'pg', J: J, kunci: kunci,
      periode: j.periode, soal: j.soal, jawab: LS.get(kunci, {}), akhir: Date.now() + j.sisa * 1000, idx: 0, kirim: false };
    bukaUjian();
  } catch (e) { closeModal(); alertBox('Tidak bisa memulai', esc(e.message)); }
}
function hasilTeks(J, h) {
  if (J && J.tipe === 'disc') return h.profil ? 'Gaya kerja Anda:' + discHTML(h.profil, h.skor, true) : 'Belum ada jawaban lengkap yang terkirim.';
  return 'Nilai Anda: <b>' + fmtN(h.nilai) + '</b><br>' + (h.benar || 0) + ' dari ' + (h.jumlah || 0) + ' soal benar.';
}
const lengkap = id => { const a = UJ.jawab[id]; return UJ.tipe === 'disc' ? /^[ABCD]{2}$/.test(a || '') : !!a; };
function setDisc(id, pos, L) {
  const a = (UJ.jawab[id] || '--').split('');
  a[pos] = L; if (a[1 - pos] === L) a[1 - pos] = '-';
  UJ.jawab[id] = a.join(''); LS.set(UJ.kunci, UJ.jawab);
  if (lengkap(id) && UJ.idx < UJ.soal.length - 1) setTimeout(() => { UJ.idx++; gambarSoal(); $('#scrUjian').scrollTo(0, 0); }, 250); else gambarSoal();
}
function bukaUjian() {
  if (!$('#scrUjian')) document.body.insertAdjacentHTML('beforeend', '<section id="scrUjian" class="ujian"></section>');
  gambarSoal();
  clearInterval(UJ.timer); UJ.timer = setInterval(tickUjian, 1000); tickUjian();
}
function tutupUjian() { if (UJ) clearInterval(UJ.timer); const s = $('#scrUjian'); if (s) s.remove(); UJ = null; }
function gambarSoal() {
  const n = UJ.soal.length, q = UJ.soal[UJ.idx], dijawab = UJ.soal.filter(s => lengkap(s.id)).length, disc = UJ.tipe === 'disc';
  const a = UJ.jawab[q.id] || '--';
  const isi = disc ? '<div style="font-size:16px;font-weight:700">Nomor ' + (UJ.idx + 1) + '</div><div class="small">Pilih 1 <b>paling sesuai</b> dan 1 <b>paling tidak sesuai</b> dengan diri Anda.</div>' +
      q.opsi.map((o, i) => { const L = 'ABCD'[i]; return '<div class="opt" style="display:block' + (a[0] === L ? ';border-color:var(--green)' : a[1] === L ? ';border-color:var(--red)' : '') + '"><span>' + esc(o) + '</span><div class="dpick"><button data-m="' + L + '"' + (a[0] === L ? ' class="m"' : '') + '>Paling sesuai</button><button data-l="' + L + '"' + (a[1] === L ? ' class="l"' : '') + '>Paling tidak sesuai</button></div></div>'; }).join('')
    : '<div style="font-size:16px;line-height:1.5;font-weight:600">' + esc(q.soal) + '</div>' +
      q.opsi.map((o, i) => { const L = 'ABCD'[i]; return o ? '<button class="opt' + (UJ.jawab[q.id] === L ? ' on' : '') + '" data-o="' + L + '"><b>' + L + '</b><span>' + esc(o) + '</span></button>' : ''; }).join('');
  $('#scrUjian').innerHTML = '<div class="ujTop"><div class="f" style="flex:1"><b>' + esc(UJ.nama) + '</b><div class="small">' + (disc ? 'Nomor ' : 'Soal ') + (UJ.idx + 1) + ' dari ' + n + ' · dijawab ' + dijawab + '</div></div><div class="ujTimer" id="ujTimer">--:--</div></div>' +
    '<div class="wrap"><div class="card">' + isi + '</div>' +
    '<div class="row" style="margin-bottom:12px"><button class="btn ghost f" id="ujPrev"' + (UJ.idx ? '' : ' disabled') + '>‹ Sebelumnya</button><button class="btn light f" id="ujNext"' + (UJ.idx < n - 1 ? '' : ' disabled') + '>Berikutnya ›</button></div>' +
    '<div class="card"><div class="small" style="margin-bottom:8px">Lompat ke soal</div><div class="nums">' + UJ.soal.map((s, i) => '<button data-i="' + i + '" class="' + (lengkap(s.id) ? 'on' : '') + (i === UJ.idx ? ' cur' : '') + '">' + (i + 1) + '</button>').join('') + '</div></div>' +
    '<button class="btn primary block" id="ujKirim">Kirim jawaban</button><div id="ujErr" class="err hidden"></div><div style="height:24px"></div></div>';
  const S = $('#scrUjian');
  S.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setDisc(q.id, 0, b.dataset.m));
  S.querySelectorAll('[data-l]').forEach(b => b.onclick = () => setDisc(q.id, 1, b.dataset.l));
  S.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    UJ.jawab[q.id] = b.dataset.o; LS.set(UJ.kunci, UJ.jawab);
    if (UJ.idx < n - 1) setTimeout(() => { UJ.idx++; gambarSoal(); S.scrollTo(0, 0); }, 180); else gambarSoal();
  });
  S.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { UJ.idx = +b.dataset.i; gambarSoal(); S.scrollTo(0, 0); });
  $('#ujPrev').onclick = () => { UJ.idx--; gambarSoal(); };
  $('#ujNext').onclick = () => { UJ.idx++; gambarSoal(); };
  $('#ujKirim').onclick = () => kirimUjian(false);
  tickUjian();
}
function tickUjian() {
  if (!UJ || !$('#ujTimer')) return;
  const s = Math.max(0, Math.round((UJ.akhir - Date.now()) / 1000));
  const t = $('#ujTimer'); t.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); t.classList.toggle('low', s < 120);
  if (s <= 0 && !UJ.kirim) kirimUjian(true);
}
async function kirimUjian(otomatis) {
  if (!UJ || UJ.kirim) return;
  const kosong = UJ.soal.filter(s => !lengkap(s.id)).length;
  if (!otomatis && !(await confirmBox('Kirim jawaban?', (kosong ? '<b>' + kosong + (UJ.tipe === 'disc' ? ' nomor belum lengkap.' : ' soal belum dijawab.') + '</b><br>' : 'Semua sudah dijawab.<br>') + 'Setelah dikirim, jawaban tidak bisa diubah.', 'Kirim'))) return;
  if (!UJ) return;
  UJ.kirim = true; clearInterval(UJ.timer);
  busy(otomatis ? 'Waktu habis. Mengirim jawaban...' : 'Mengirim jawaban...');
  try {
    const j = UJ.jenis ? await api('subKirim', { jenis: UJ.jenis, periode: UJ.periode, jawaban: UJ.jawab })
      : await api('ujianKirim', { periode: UJ.periode, jawaban: UJ.jawab });
    closeModal();
    LS.del(UJ.kunci);
    const J = UJ.J, disc = UJ.tipe === 'disc';
    tutupUjian();
    await alertBox(disc ? 'Tes selesai' : 'Ujian selesai', hasilTeks(J, j.hasil) + (j.telat ? '<br><br>Jawaban terkirim setelah batas waktu sehingga tidak dihitung. Hubungi admin.' : ''));
    K = null; renderTab();
  } catch (e) {
    closeModal();
    UJ.kirim = false;
    if (Date.now() < UJ.akhir) { UJ.timer = setInterval(tickUjian, 1000); }
    showErr($('#ujErr'), (e.net ? 'Gagal terkirim karena tidak ada internet. ' : e.message + ' ') + 'Jawaban tersimpan di HP. Tekan "Kirim jawaban" lagi setelah internet tersambung (paling lambat 10 menit setelah waktu habis).');
  }
}

function garis(ser, label, o) {
  o = o || {};
  const semua = []; ser.forEach(s => s.nilai.forEach(v => { if (v !== null && v !== undefined) semua.push(v); }));
  if (!semua.length) return '<div class="kosong">' + esc(o.kosong || 'Belum ada data.') + '</div>';
  const W = 330, H = o.tinggi || 170, L = 30, R = 14, T = 18, Bm = 24, n = label.length;
  let lo = 0; const mn = Math.min.apply(null, semua);
  if (o.zoom && mn >= 60) lo = Math.floor((mn - 10) / 10) * 10;
  const X = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1), Y = v => T + (100 - v) * (H - T - Bm) / (100 - lo);
  const id = 'g' + (++gid);
  let g = '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + ser[0].warna + '" stop-opacity=".28"/><stop offset="1" stop-color="' + ser[0].warna + '" stop-opacity="0"/></linearGradient></defs>';
  [lo, lo + (100 - lo) / 2, 100].forEach(v => { g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + WARNA.grid + '" stroke-dasharray="' + (v === lo ? '0' : '3 4') + '"/><text x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end" font-size="10" fill="' + WARNA.mut + '">' + Math.round(v) + '</text>'; });
  if (o.garisAcuan) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(o.garisAcuan) + '" y2="' + Y(o.garisAcuan) + '" stroke="' + WARNA.orange + '" stroke-width="1" stroke-dasharray="5 4"/><text x="' + (L + 4) + '" y="' + (Y(o.garisAcuan) + 12) + '" text-anchor="start" font-size="9.5" fill="#A86600">' + esc(o.acuanTeks || '') + '</text>';
  label.forEach((x, i) => { g += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="' + WARNA.mut + '">' + esc(x) + '</text>'; });
  // urutan gambar: seri tipis dulu, seri utama paling atas
  ser.slice().reverse().forEach((s, si) => {
    const utama = si === ser.length - 1;
    let d = '', pen = false, pts = [];
    s.nilai.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; pen = true; pts.push(i); });
    if (utama && pts.length > 1 && !o.tanpaArea) {
      const seg = []; let cur = [];
      s.nilai.forEach((v, i) => { if (v === null || v === undefined) { if (cur.length) seg.push(cur); cur = []; } else cur.push(i); });
      if (cur.length) seg.push(cur);
      seg.filter(c => c.length > 1).forEach(c => { g += '<path d="M' + X(c[0]) + ' ' + Y(lo) + ' ' + c.map(i => 'L' + X(i).toFixed(1) + ' ' + Y(s.nilai[i]).toFixed(1)).join(' ') + ' L' + X(c[c.length - 1]) + ' ' + Y(lo) + 'Z" fill="url(#' + id + ')"/>'; });
    }
    g += '<path d="' + d + '" fill="none" stroke="' + s.warna + '" stroke-width="' + (s.tipis ? 1.5 : 2.5) + '" stroke-linejoin="round" stroke-linecap="round"' + (s.tipis ? ' opacity=".55"' : '') + '/>';
    pts.forEach(i => {
      const tip = esc((s.nama ? s.nama + ' · ' : '') + label[i] + ': ' + fmtN(s.nilai[i]));
      if (!s.tipis || pts.length === 1) g += '<circle cx="' + X(i) + '" cy="' + Y(s.nilai[i]) + '" r="' + (s.tipis ? 3 : 4.5) + '" fill="' + s.warna + '" stroke="#fff" stroke-width="2"/>';
      g += '<circle cx="' + X(i) + '" cy="' + Y(s.nilai[i]) + '" r="13" fill="transparent" data-tip="' + tip + '"/>';
    });
    if (utama && pts.length) { const li = pts[pts.length - 1]; g += '<text x="' + Math.min(X(li), W - R - 8) + '" y="' + (Y(s.nilai[li]) - 10) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + WARNA.ink + '">' + fmtN(s.nilai[li]) + '</text>'; }
  });
  const leg = ser.length > 1 && !o.tanpaLegenda ? '<div class="lgl">' + ser.filter(s => !s.tipis).map(s => '<span><i style="background:' + s.warna + '"></i>' + esc(s.nama) + '</span>').join('') + (ser.some(s => s.tipis) ? '<span><i style="background:#9AA9A8;height:2px"></i>' + esc(o.tipisTeks || 'per orang') + '</span>' : '') + '</div>' : '';
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.nama || 'grafik') + '">' + g + '</svg></div>' + leg +
    (semua.length === 1 && o.satuTitik ? '<div class="small" style="margin-top:2px">' + esc(o.satuTitik) + '</div>' : '');
}

// Skor DISC (−24..+24) sebagai batang dua arah.

  return '<div class="db">' + 'DISC'.split('').map(k => {
    const v = skor[k] || 0, w = Math.abs(v) / m * 50;
    return '<div class="dbr' + (profil && profil.includes(k) ? ' on' : '') + '"><div class="dbk" style="background:' + DISC_W[k] + '">' + k + '</div><div class="dbn">' + DISC_NAMA[k] + '</div>' +
      '<div class="dbt"><i style="' + (v >= 0 ? 'left:50%' : 'left:' + (50 - w) + '%') + ';width:' + w + '%;background:' + DISC_W[k] + '"></i><b></b></div><div class="dbv">' + (v > 0 ? '+' : '') + v + '</div></div>';
  }).join('') + '</div>';
}

    if (K.admin) h += '<div class="card"><b>Jenis ujian</b><div class="small" style="margin:4px 0 10px">Tambah tes baru: pilihan ganda (mis. tes produk), gaya kerja DISC, atau praktik (checklist yang diisi penilai). Tes ini tidak masuk bonus.</div><button class="btn light block" id="jTambah">+ Tambah jenis ujian</button></div>';

  el.querySelectorAll('[data-sdisc]').forEach(b => b.onclick = () => { const j = SUB.jenis.find(x => x.kode === b.dataset.sdisc), H = j.hasil || j.discLalu; alertBox('Gaya kerja Anda', discHTML(H.profil, H.skor, true)); });
  el.querySelectorAll('[data-princi]').forEach(b => b.onclick = () => rincianPraktik(SUB.jenis.find(j => j.kode === b.dataset.princi)));
  if (K.penilai) {

function kartuSub(j) {
  const H = j.hasil;
  let b = '<div class="card"><div class="row"><b class="f">' + esc(j.nama) + '</b><span class="chip">' + TIPEN[j.tipe] + '</span></div>' + (j.ket ? '<div class="small" style="margin-top:4px">' + esc(j.ket) + '</div>' : '');
  if (j.tipe === 'praktik') {
    b += H && H.status === 'Selesai' ? '<div class="row" style="margin-top:8px"><div class="big">' + fmtN(H.nilai) + '</div><div class="small f">Dinilai ' + esc(H.penilai) + '<br>' + esc(H.selesai) + '</div><button class="link" data-princi="' + esc(j.kode) + '">Rincian</button></div>'
      : '<div class="small" style="margin-top:8px">Belum dinilai triwulan ini. Pemilik/apoteker akan mengamati Anda saat melayani pembeli atau lewat role-play.</div>';
  } else if (H && H.status === 'Selesai') {
    b += j.tipe === 'disc' ? discHTML(H.profil, H.skor) + '<button class="link" data-sdisc="' + esc(j.kode) + '" style="margin-top:6px">Lihat penjelasan</button>'
      : '<div class="row" style="margin-top:8px"><div class="big">' + fmtN(H.nilai) + '</div><div class="small f">Nilai triwulan ini<br>' + H.benar + ' dari ' + H.jumlah + ' soal benar</div></div>';
  } else if (H && H.status === 'Berlangsung') {
    b += '<div class="small" style="margin:8px 0 10px">Sedang berjalan. Sisa waktu ±' + Math.ceil((H.sisa || 0) / 60) + ' menit.</div><button class="btn orange block" data-smulai="' + esc(j.kode) + '">Lanjutkan</button>';
  } else if (j.dibuka) {
    b += '<div class="small" style="margin:8px 0 10px">' + j.jumlah + (j.tipe === 'disc' ? ' nomor' : ' soal') + ' · ' + j.durasi + ' menit · 1 kali per triwulan.</div><button class="btn primary block" data-smulai="' + esc(j.kode) + '">Mulai</button>';
  } else {
    b += '<div class="small" style="margin-top:8px">Belum dibuka.' + (j.discLalu ? ' Hasil terakhir (' + esc(j.discLalu.periode) + '): <b>' + esc(j.discLalu.profil) + '</b>' : '') + '</div>' +
      (j.discLalu ? '<button class="link" data-sdisc="' + esc(j.kode) + '">Lihat penjelasan</button>' : '');

}

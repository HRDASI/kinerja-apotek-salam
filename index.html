  $('#mOk').onclick = closeModal;
  $('#roTambah').onclick = () => formRencana(R, null, kembali);
  $('#sheet').querySelectorAll('[data-gap]').forEach(b => b.onclick = () => formRencana(R, null, kembali, R.gap.find(g => g.id === b.dataset.gap)));
  $('#sheet').querySelectorAll('[data-rid]').forEach(b => b.onclick = () => formRencana(R, R.data.find(x => x.id === b.dataset.rid), kembali));
}
// kembali(R baru) dipanggil setelah simpan/hapus. gap = saran tugas untuk target baru.
function formRencana(R, x, kembali, gap) {
  const baru = !x, tutup = x && !R.penilai && (x.status === 'Tercapai' || x.status === 'Tidak tercapai');
  x = x || { id: '', target: gap ? 'Mencapai level Mandiri: ' + gap.tugas : '', tugas: gap ? [gap.id] : [], materi: [], status: 'Rencana', catatan: '' };
  const opsiTugas = [...new Set(R.gap.map(g => g.id).concat(x.tugas))];
  const statusBoleh = R.penilai || K.admin ? R.status : R.status.slice(0, 2).concat(R.status.slice(2).filter(s => s === x.status));
  const dis = tutup ? ' disabled' : '';
  modal('<h3>' + (baru ? 'Tambah target' : 'Target') + '</h3><div class="small">' + esc(R.nama) + '</div>' +
    (tutup ? '<div class="banner" style="margin-top:10px">Target ini sudah ditutup atasan.</div>' : '') +
    '<label for="frT">Target</label><textarea id="frT" class="inp" rows="2" maxlength="200"' + dis + ' placeholder="mis. Bisa closing kas sendiri tanpa selisih">' + esc(x.target) + '</textarea>' +
    (opsiTugas.length ? '<label>Keterampilan terkait</label><div class="cekl">' + opsiTugas.map(id => '<label><input type="checkbox" data-frt="' + esc(id) + '"' + (x.tugas.includes(id) ? ' checked' : '') + dis + '> ' + esc(R.namaTugas[id] || id) + '</label>').join('') + '</div>' : '') +
    (Object.keys(R.materi).length ? '<label>Materi yang dipelajari</label><div class="cekl">' + Object.keys(R.materi).map(id => '<label><input type="checkbox" data-frm="' + esc(id) + '"' + (x.materi.includes(id) ? ' checked' : '') + dis + '> ' + esc(R.materi[id]) + '</label>').join('') + '</div>' : '') +
    '<label for="frS">Status</label><select id="frS" class="inp"' + dis + '>' + statusBoleh.map(s => '<option' + (x.status === s ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>' +
    '<label for="frC">Catatan perkembangan</label><textarea id="frC" class="inp" rows="2" maxlength="500"' + dis + '>' + esc(x.catatan) + '</textarea>' +
    '<div id="frErr" class="err hidden"></div>' +
    (tutup ? '<button class="btn ghost block" id="frBatal" style="margin-top:12px">Tutup</button>' : tombolSimpan('frBatal', 'frSimpan')) +
    (!baru && !tutup ? '<button class="btn danger block" id="frHapus" style="margin-top:8px">Hapus target</button>' : ''));
  $('#frBatal').onclick = () => R.diri ? closeModal() : gambarRencanaOrang(R);
  if (tutup) return;
  $('#frSimpan').onclick = () => simpanDengan($('#frSimpan'), $('#frErr'), async () => {
    const d = { id: x.id, nama: R.nama, target: $('#frT').value.trim(), status: $('#frS').value, catatan: $('#frC').value.trim(),
      tugas: [...$('#sheet').querySelectorAll('[data-frt]:checked')].map(c => c.dataset.frt), materi: [...$('#sheet').querySelectorAll('[data-frm]:checked')].map(c => c.dataset.frm) };
    if (d.target.length < 5) throw new Error('Tulis target dengan jelas.');
    const r = await api('rencanaSimpan', { data: d });
    if (R.diri) closeModal();
    toast('Target disimpan.'); kembali(r);
  });
  if ($('#frHapus')) $('#frHapus').onclick = async () => {
    if (!(await confirmBox('Hapus target?', esc(x.target), 'Hapus'))) return R.diri ? null : gambarRencanaOrang(R);
    try { const r = await api('rencanaHapus', { id: x.id }); toast('Target dihapus.'); kembali(r); } catch (e) { alertBox('Gagal', esc(e.message)); }
  };
}

/* ================= v2: Riwayat ================= */
const perPendek = p => { const m = /^(\d{4})-T(\d)$/.exec(p); return m ? 'T' + m[2] + ' ’' + m[1].slice(2) : p; };
// Grafik garis satu seri, skala 0–100. Titik bisa diketuk.
function grafik(pts, nama) {
  const ada = pts.filter(p => p.y !== null && p.y !== undefined);
  if (!ada.length) return '<div class="small">Belum ada data.</div>';
  const W = 320, H = 150, L = 30, R = 16, T = 16, Bm = 24, n = pts.length;
  const X = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1), Y = v => T + (100 - v) * (H - T - Bm) / 100;
  let g = '';
  [0, 50, 100].forEach(v => { g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#E2E9E8" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end" font-size="10" fill="#687776">' + v + '</text>'; });
  let d = '', pen = false;
  pts.forEach((p, i) => { if (p.y === null || p.y === undefined) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1) + ' '; pen = true; });
  g += '<path d="' + d + '" fill="none" stroke="#0FADA6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p, i) => {
    g += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#687776">' + esc(p.x) + '</text>';
    if (p.y === null || p.y === undefined) return;
    g += '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="4" fill="#0FADA6" stroke="#fff" stroke-width="2"/>' +
      '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="14" fill="transparent" data-tip="' + esc(nama + ' ' + p.x + ': ' + fmtN(p.y)) + '"/>';
  });
  const li = pts.map((p, i) => i).filter(i => pts[i].y !== null && pts[i].y !== undefined).pop();
  g += '<text x="' + X(li) + '" y="' + (Y(pts[li].y) - 9) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2928">' + fmtN(pts[li].y) + '</text>';
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(nama) + '">' + g + '</svg></div>';
}
async function bukaRiwayat(nama) {
  busy('Memuat riwayat...');
  let R;
  try { R = await api('riwayat', { target: nama }); } catch (e) { closeModal(); return alertBox('Gagal', esc(e.message)); }
  const sub = R.jenis.filter(j => R.data.some(d => d.sub[j.kode] !== undefined));
  modal('<h3>Riwayat ' + esc(R.nama) + '</h3><div class="small">' + esc(R.jabatanNama) + '</div>' +
    '<div class="dateHead" style="margin-left:0">Nilai kinerja (final)</div>' + grafik(R.data.map(d => ({ x: perPendek(d.periode), y: d.total })), 'Nilai kinerja') +
    '<div class="dateHead" style="margin-left:0">Keterampilan mandiri (%)</div>' + grafik(R.data.map(d => ({ x: perPendek(d.periode), y: d.mandiri })), 'Mandiri') +
    '<div class="dateHead" style="margin-left:0">Tabel</div><div class="tblw"><table class="tbl"><tr><th>Triwulan</th><th>Nilai</th><th>Ujian</th>' + sub.map(j => '<th>' + esc(j.nama.replace(/^(Tes|Ujian) /, '').replace(/ \(.*\)/, '')) + '</th>').join('') + '<th>Mandiri</th></tr>' +
    R.data.slice().reverse().map(d => '<tr><td>' + esc(perPendek(d.periode)) + '</td><td>' + fmtN(d.total) + '</td><td>' + fmtN(d.ujian) + '</td>' + sub.map(j => '<td>' + fmtN(d.sub[j.kode]) + '</td>').join('') + '<td>' + (d.mandiri === null ? '–' : d.mandiri + '%') + '</td></tr>').join('') + '</table></div>' +
    (R.disc ? '<div class="dateHead" style="margin-left:0">Gaya kerja (DISC ' + esc(R.disc.periode) + ')</div>' + discHTML(R.disc.profil, R.disc.skor, false) : '') +
    '<button class="btn ghost block" id="mOk" style="margin-top:14px">Tutup</button>');
  $('#mOk').onclick = closeModal;
}
